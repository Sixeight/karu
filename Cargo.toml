[package]
name = "karu"
version = "0.1.0"
edition = "2024"
description = "Tidy leftover git branches and worktrees"
license = "MIT"
repository = "https://github.com/Sixeight/karu"
readme = "README.md"
keywords = ["git", "branch", "worktree", "cleanup", "cli"]
categories = ["command-line-utilities", "development-tools"]
# let-chains; edition 2024 alone would only need 1.85
rust-version = "1.88"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
crossterm = { version = "0.28", default-features = false, features = ["windows"] }
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
